name: MKtest Windows Build

on:
  # Feature branches are checked through their pull requests.
  # This avoids running the same build twice on push + pull_request.
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WinForms (.NET 9, Release)
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Show SDK version
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore MKtest.sln --verbosity minimal

      - name: Build MKtest (Release)
        run: dotnet build MKtest.sln --configuration Release --no-restore --verbosity minimal -p:ContinuousIntegrationBuild=true

      - name: Run automated tests
        run: dotnet test MKtest.Tests/MKtest.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal --logger "trx;LogFileName=MKtest.Tests.trx"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MKtest-Test-Results-${{ github.run_number }}
          path: MKtest.Tests/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release files
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: MKtest-Windows-Release-${{ github.run_number }}
          path: MKtest/bin/Release/net9.0-windows/
          if-no-files-found: error
          retention-days: 14
