name: MKtest Setup Project

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Build and verify MSI (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build and test application
        run: dotnet test MKtest.Tests/MKtest.Tests.csproj --configuration Release --verbosity normal --logger "trx;LogFileName=MKtest.Tests.trx"

      - name: Build Visual Studio Setup Project
        shell: pwsh
        run: ./MKtest.Setup/Build-Setup.ps1

      - name: Verify installation, shortcuts, launch and uninstall
        shell: pwsh
        run: ./MKtest.Setup/Test-Setup.ps1

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: MKtest-Setup-win-x64-${{ github.run_number }}
          path: MKtest.Setup/Release/MKtest.Setup.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and installer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MKtest-Setup-Logs-${{ github.run_number }}
          path: |
            artifacts/setup-logs/
            MKtest.Tests/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
