name: MKtest Setup Project

on:
  workflow_dispatch:
    inputs:
      previous_run_id:
        description: 'Optional .NET 9 installer run ID for testing the upgrade from 1.0.0'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: setup-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Build and verify MSI (.NET Framework 4.8, x64)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build and test application
        run: dotnet test MKtest.Tests/MKtest.Tests.csproj --configuration Release --verbosity normal --logger "trx;LogFileName=MKtest.Tests.trx"

      - name: Build Visual Studio Setup Project
        shell: pwsh
        run: ./MKtest.Setup/Build-Setup.ps1

      - name: Verify installation, shortcuts, launch and uninstall
        shell: pwsh
        run: ./MKtest.Setup/Test-Setup.ps1

      - name: Verify upgrade from the previous installer
        if: inputs.previous_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
        run: |
          gh run download "$env:PREVIOUS_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --pattern 'MKtest-Setup-win-x64-*' --dir artifacts/previous-setup
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download the previous installer.' }
          $previous = @(Get-ChildItem artifacts/previous-setup -Recurse -Filter MKtest.Setup.msi)
          if ($previous.Count -ne 1) { throw 'Expected exactly one previous MSI.' }
          ./MKtest.Setup/Test-Setup.ps1 -PreviousMsi $previous[0].FullName

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: MKtest-Setup-Windows7-x64-${{ github.run_number }}
          path: |
            MKtest.Setup/Release/MKtest.Setup.msi
            MKtest.Setup/Release/setup.exe
            MKtest.Setup/INSTALL-WINDOWS7.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and installer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MKtest-Setup-Logs-${{ github.run_number }}
          path: |
            artifacts/setup-logs/
            MKtest.Tests/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
